[project]
name = "rigger2d"
version = "0.1.0"
description = "Automatic 2D character segmentation, slicing and rigging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "2DAutoRigger contributors" }]
keywords = ["2d", "rigging", "segmentation", "godot", "spine", "unity", "character"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]

dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
mesh = ["scipy>=1.11"]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.5",
  # tools/schema_check.py and the tests that call it. Development only: the
  # core does not validate schemas at runtime.
  "jsonschema>=4.20",
]

[project.scripts]
autorigger2d = "rigger2d.cli:main"

[project.urls]
Homepage = "https://github.com/matbn/2DAutoRigger"
Issues = "https://github.com/matbn/2DAutoRigger/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/rigger2d"]
# adapters/ holds independent packages, each with its own pyproject.toml and
# its own dependencies. They are not part of the core wheel.
exclude = ["adapters", "js", "tests", "tools"]

[tool.hatch.build.targets.wheel.force-include]
"python/rigger2d/templates" = "rigger2d/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
