[project]
name = "rigger2d-adapter-birefnet"
version = "0.1.0"
description = "BiRefNet (high resolution matte) backend for 2DAutoRigger."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "2DAutoRigger contributors" }]

dependencies = [
  "torch>=2.2",
  "transformers",
  "timm",
  "safetensors",
]

[project.entry-points."rigger2d.adapters"]
"birefnet.matte" = "rigger2d_adapter_birefnet:adapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rigger2d_adapter_birefnet"]
