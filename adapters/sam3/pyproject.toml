[project]
name = "rigger2d-adapter-sam3"
version = "0.1.0"
description = "SAM 3 (promptable segmentation) backend for 2DAutoRigger."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "2DAutoRigger contributors" }]

dependencies = [
  "torch>=2.7",
  "safetensors",
  "sam3",
]

[project.entry-points."rigger2d.adapters"]
"sam3.promptable" = "rigger2d_adapter_sam3:adapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rigger2d_adapter_sam3"]
